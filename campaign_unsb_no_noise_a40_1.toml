# Deterministic-bridge UNSB row, seed 3, on A40 GPU 1. See
# campaign_unsb_no_noise_local.toml for why n_styles is pinned rather than
# derived. This seed's threshold lay beyond the 768-pool grid the other two
# were measured on, so its value comes from the extended
# style_coverage_unsb_no_noise_3_m1536.csv.
#
# ~/UNSB/config_no_noise.toml must exist on this machine (bridge_noise = 0);
# see campaign_unsb_no_noise_a40_0.toml for the one-liner that makes it.
#
#     uv run python campaign_runner.py campaign_unsb_no_noise_a40_1.toml

[campaign]
gpu = 1
template = "gan_pool_permafrost2_b96_a40.toml"  # data paths under ~/Datasets
unsb_repo = "~/UNSB"
pool_root = "~/Datasets/campaign_pools"
print_dir = "~/Datasets/Siamese/Compiled/Shoeprints/train"
# ~81 GB of pool at this N: check /dev/shm is sized for it before launching
train_root = "/dev/shm/campaign"

[[job]]
name = "unsb_no_noise_3"
backend = "unsb"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_3"
epoch = 60
n_styles = 860
