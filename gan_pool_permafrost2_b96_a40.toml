[hyperparameters]
distance_norm = 2
margin = 2
batch_size = 96 # Mining arm: doubled pool; fits because the permafrost2 trainable set (fc+layer4+layer3) stays under the 24 GB ceiling
embedding_size = 128
triplet_swapping = true

[training]
seed = 4242
epochs = 5_000
gpu_number = 0
print_iter = 100
val_iter = 500
name = "gan_pool_permafrost2_b96"
resume_checkpoint = "" # Leave empty for no resuming

[training.pre_training]
pre_trained = true
frozen = true
# Conditional mining arm of the ladder-depth decision tree: identical to
# gan_pool_permafrost2.toml except batch 96. Stage 1 showed the full ladder
# beating shallow@48 by ~4 S1 points (0.790 vs 0.749 best) — narrow against
# checkpoint spread, so this isolates whether a doubled mining pool closes
# the gap. Deep-ladder@96 cannot run (exceeds 24 GB), hence the sequential
# design rather than a full 2x2.
unfreeze_cadence = 500 # Number of epochs between layer unfreezes
ladder_depth = 2 # Residual stages the ladder opens (fc + layer4 + layer3); 0 unfreezes all

[curriculum]
# Pooled protocol: marks pre-generated with generate_pool.py --backend gan from
# the best-FID checkpoint ([inference].checkpoint in the GAN config) and
# streamed from synthetic_shoemark_data_dir below; no in-loop generation.
# pool_curriculum draws from difficulty-stratified pool trees (train_d0.2 etc.)
# following the difficulty schedule — the curriculum arm of the A/B test
enabled = false
initial_difficulty = 0.2
max_difficulty = 1.0
peak_steps = 2_500

# Affine transform applied to shoeprints
[augmentations.shoeprint_affine]
enabled = true
flip = true
degrees = 10
translate = [0.05, 0.15]
scale = [0.9, 1.1]
shear = 0.05
fill = 1.0

# Affine transform applied to shoemarks without a pre-existing background
[augmentations.shoemark_affine]
enabled = true
flip = true
degrees = 20
translate = [0.1, 0.3]
scale = [0.75, 1.25]
shear = 0.1
fill = 1.0

# Smaller affine (black fill) applied to shoemarks with a pre-existing background
[augmentations.shoemark_back_affine]
enabled = true
flip = true
degrees = 10
translate = [0.05, 0.15]
scale = [0.9, 1.1]
shear = 0.05
fill = 0.0

# Blend no-background shoemarks onto floor images (dust marks are never blended)
[augmentations.background_substitution]
enabled = true

# Random inversion of dust shoemarks
[augmentations.dust_invert]
enabled = true

# Blue channel shift simulating enhanced blood shoemarks
[augmentations.blue_shift]
enabled = true
p = 0.333
max_shift = 0.25

# Random erasing applied before background blending (mutually exclusive with post_blend_crop)
[augmentations.pre_blend_erasing]
enabled = true
p = 0.5
min_scale = 0.1
max_scale = 0.5
fill = 1.0

# Random crop, scale, and pad applied after background blending
[augmentations.post_blend_crop]
enabled = true
p = 0.5
min_edge = 225
fill = 0.0

# Blur/sharpness and colour jitter applied to shoemarks without a pre-existing background
[augmentations.photometric]
enabled = true
blur_kernel = [5, 9]
blur_sigma = [0.1, 5.0]
sharpness_factor = 2
jitter_p = 0.5
brightness = 0.4
hue = 0.2

[data]
val_dir = "~/Datasets/Siamese/Evaluation/no_synth/val/"
test_dir = "~/Datasets/Siamese/Evaluation/no_synth/test/"
wvu_data_dir = "~/Datasets/Siamese/Evaluation/wvu/cropped/"
fid_data_dir = "~/Development/Doctorate/siamese/data/Testing/FIXME"
image_size = [512, 256]

[data.streaming]
floor_image_data_dir = "~/Datasets/Flooring/train"
shoeprint_data_dir = "~/Datasets/Siamese/Compiled/Shoeprints/train"
shoemark_data_dir = "~/Datasets/Siamese/Compiled/Shoemarks/train"
# pre-generated GAN marks (generate_pool.py --backend gan); classes without a
# real shoemark draw a random pool image instead of invoking the generator.
# NVMe replica of the canonical ~/Extra tree: random reads from the HDD
# saturate it (~240 IOPS) and the page cache can't hold the tree at batch 96
synthetic_shoemark_data_dir = "~/Development/Doctorate/synthetic/Shoemarks_GAN/train"
min_floor_roi_height = 512
synthetic_ratio = 0.5
# Drop classes without a real shoemark instead of substituting a stand-in
# (the no-synthetic baseline row)
real_pairs_only = false
