# Dual-encoder chapter campaign (2026-08-20), training-seed-422 stripe, A40
# GPU 0. See campaign_dual_encoder_local.toml for the campaign layout.
#
# Every generator-fed row uses THE pinned generator: unsb_no_noise_1 @ 56,
# N=657 — the pipeline ablation varies the pipeline, not the generator, so the
# replicates vary the dual-encoder training seed (4242/422/423 across stripes)
# on one shared pool. pipe_full is this stripe's everything-on baseline (the
# 4242 baseline is the existing unsb_no_noise_1 row).
#
# The pool is TRANSFERRED from the local machine, not generated here: rsync
# ~/Development/Doctorate/synthetic/campaign/active_gpu0/ (train/ + job.txt,
# 82 GB) into ~/Datasets/campaign_pools/active_gpu0/ — the marker
# "unsb_no_noise_1 shoeprint_unsb_v2_no_noise_1:56 N=657" makes stage_pool
# resume it, and generate_pool exits before loading the generator when the
# pool is complete, so the no_noise_1 checkpoint is not needed here.
#
# Requires the siamese repo synced first (real_pairs_only + campaign_runner
# changes) and the UNSB repo synced for the generate_pool early exit.
#
#     uv run python campaign_runner.py campaign_dual_encoder_a40_0.toml

[campaign]
gpu = 0
template = "gan_pool_permafrost2_b96_a40.toml"  # data paths under ~/Datasets
unsb_repo = "~/UNSB"
pool_root = "~/Datasets/campaign_pools"
print_dir = "~/Datasets/Siamese/Compiled/Shoeprints/train"
# ~63 GB of pool at this N: check /dev/shm is sized for it before launching
train_root = "/dev/shm/campaign"

# --- Block 1: pipeline augmentation ablations -------------------------------

[[job]]
name = "pipe_full_2"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"training.seed" = 422

[[job]]
name = "pipe_no_geometric_2"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"training.seed" = 422
"augmentations.shoeprint_affine.enabled" = false
"augmentations.shoemark_affine.enabled" = false
"augmentations.shoemark_back_affine.enabled" = false

[[job]]
name = "pipe_no_photometric_2"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"training.seed" = 422
"augmentations.photometric.enabled" = false
"augmentations.blue_shift.enabled" = false

[[job]]
name = "pipe_no_background_2"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"training.seed" = 422
"augmentations.background_substitution.enabled" = false

[[job]]
name = "pipe_no_partial_2"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"training.seed" = 422
"augmentations.pre_blend_erasing.enabled" = false
"augmentations.post_blend_crop.enabled" = false

[[job]]
name = "pipe_no_dust_invert_2"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"training.seed" = 422
"augmentations.dust_invert.enabled" = false

# --- Block 2: generator-comparison baselines --------------------------------

[[job]]
name = "no_synthetic_2"
backend = "none"
[job.set]
"training.seed" = 422
"data.streaming.synthetic_ratio" = 0.0
"data.streaming.real_pairs_only" = true

[[job]]
name = "no_generator_2"
backend = "none"
[job.set]
"training.seed" = 422

