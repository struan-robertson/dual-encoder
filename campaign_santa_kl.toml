# Single-configuration queue: the SANTA KL-substitution rows (Xie et al.
# formulation + latent noise), one job per seed, on the rented pod.
#
#     uv run python campaign_runner.py campaign_santa_kl.toml

[campaign]
gpu = 0
template = "gan_pool_permafrost2_b96_pod.toml"
unsb_repo = "~/UNSB"                                # holds generate_pool.py + style_coverage.py
pool_root = "/workspace/campaign_pools"                      # transient; ~30 GB per active tree
print_dir = "/workspace/Siamese/Compiled/Shoeprints/train"   # source prints for pool generation
# no train_root: single-disk pod, so pools are already on the training disk

[[job]]
name = "gan_santa_kl_1"
backend = "gan"
generator_config = "~/one-to-many-gan/config.toml"
checkpoint = "/workspace/gan_checkpoints/santa_kl_1/models/50000.tar"

[[job]]
name = "gan_santa_kl_2"
backend = "gan"
generator_config = "~/one-to-many-gan/config.toml"
checkpoint = "/workspace/gan_checkpoints/santa_kl_2/models/35000.tar"

[[job]]
name = "gan_santa_kl_3"
backend = "gan"
generator_config = "~/one-to-many-gan/config.toml"
checkpoint = "/workspace/gan_checkpoints/santa_kl_3/models/15000.tar"
