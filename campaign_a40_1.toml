# Auto-composed campaign queue (2026-08-04): GAN chapter rows first, then UNSB.
# Seed-striped: this queue holds one seed of every family. no_gan is excluded
# (best FID ~180 — noted in dual_encoder.tex).
#
#     uv run python campaign_runner.py <this file>

[campaign]
gpu = 1
template = "gan_pool_permafrost2_b96_a40.toml"  # data paths under ~/Datasets
unsb_repo = "~/UNSB"
pool_root = "~/Datasets/campaign_pools"
print_dir = "~/Datasets/Siamese/Compiled/Shoeprints/train"
train_root = "/dev/shm/campaign"  # 500 GB box: train from a tmpfs replica, not the HDD

[[job]]
name = "gan_full_3"
backend = "gan"
generator_config = "~/one-to-many-gan/config.toml"
checkpoint = "~/one-to-many-gan/checkpoints/new_data_partition_fid_3/models/50000.tar"

[[job]]
name = "gan_no_align_3"
backend = "gan"
generator_config = "~/one-to-many-gan/config.toml"
checkpoint = "~/one-to-many-gan/checkpoints/new_data_partition_fid_no_align_3/models/50000.tar"

[[job]]
name = "gan_no_idt_3"
backend = "gan"
generator_config = "~/one-to-many-gan/config.toml"
checkpoint = "~/one-to-many-gan/checkpoints/new_data_partition_fid_no_idt_3/models/50000.tar"

[[job]]
name = "gan_no_path_3"
backend = "gan"
generator_config = "~/one-to-many-gan/config.toml"
checkpoint = "~/one-to-many-gan/checkpoints/new_data_partition_fid_no_path_3/models/50000.tar"

[[job]]
name = "gan_no_rec_3"
backend = "gan"
generator_config = "~/one-to-many-gan/config.toml"
checkpoint = "~/one-to-many-gan/checkpoints/new_data_partition_fid_no_rec_3/models/50000.tar"

[[job]]
name = "gan_no_style_3"
backend = "gan"
generator_config = "~/one-to-many-gan/config.toml"
checkpoint = "~/one-to-many-gan/checkpoints/new_data_partition_fid_no_style_3/models/50000.tar"

# only_style_3: checkpoints live on the A40 box only and have no sweep yet.
# There: uv run python src/test_kid_fid.py config.toml <dir-with-only_style-runs>
# then rescore_best.py --runs only_style_1 only_style_2 only_style_3,
# then uncomment with the winning step pinned.
# [[job]]
# name = "gan_only_style_3"
# backend = "gan"
# generator_config = "~/one-to-many-gan/config.toml"
# checkpoint = "~/one-to-many-gan/checkpoints/only_style_3/models/<BEST_STEP>.tar"

[[job]]
name = "unsb_full_3"
backend = "unsb"
generator_config = "~/UNSB/config.toml"
experiment = "shoeprint_unsb_v2_3"
epoch = 36

[[job]]
name = "unsb_no_sb_3"
backend = "unsb"
generator_config = "~/UNSB/config.toml"
experiment = "shoeprint_unsb_v2_no_sb_3"
epoch = 54

[[job]]
name = "unsb_no_nce_3"
backend = "unsb"
generator_config = "~/UNSB/config.toml"
experiment = "shoeprint_unsb_v2_no_nce_3"
epoch = 38

[[job]]
name = "unsb_no_style_3"
backend = "unsb"
generator_config = "~/UNSB/config.toml"
experiment = "shoeprint_unsb_v2_no_style_3"
epoch = 38

