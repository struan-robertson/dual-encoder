# Deterministic-bridge UNSB row, seed 1. The bridge is trained and evaluated
# with bridge_noise = 0, so it has no trajectory-noise floor and its pool size
# is N_95 under the deterministic definition of the GAN chapter rather than the
# floor criterion the stochastic UNSB rows use. campaign_runner cannot derive
# it: its unsb pattern matches "N at <=1.1x floor", which a zero-floor run
# never prints, so n_styles is pinned here from
# style_coverage_unsb_no_noise_1_m1024.csv.
#
#     uv run python campaign_runner.py campaign_unsb_no_noise_local.toml

[campaign]
gpu = 0
template = "gan_pool_permafrost2_b96.toml"
unsb_repo = "~/Development/Doctorate/diffusion/UNSB"
pool_root = "~/Development/Doctorate/synthetic/campaign"

[[job]]
name = "unsb_no_noise_1"
backend = "unsb"
# config_no_noise.toml carries bridge_noise = 0; the runner patches only the
# experiment name and epoch, so the noise setting has to come from the base
generator_config = "~/Development/Doctorate/diffusion/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
