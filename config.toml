[hyperparameters]
p_val = 2
margin = 2
batch_size = 45
embedding_size = 128
triplet_swapping = true

[training]
seed = 4242
epochs = 10_000
gpu_number = 0
print_iter = 100
val_iter = 500
name = "default"
gan_config = "../one_to_many_gan/implementation/config.toml"

[training.pre_training]
pre_trained = true
frozen = true
epoch_unfreeze = 2000 # Number of epochs between layer unfreezes
defrost = 0 # When to start layer unfreezing
# TODO try permafrost 5 when I have all my hyperparameters tuned and I train for longer
permafrost = 4 # Number of layers to unfreeze before leaving frozen, 0 to unfreeze all 
refreeze = false # Refreeze previous layer after unfreezing one before


[training.shoemark_augmentation]
max_translation = [64, 32]
max_rotation = 45
max_scale = 0.25
flip = true
    
[training.shoeprint_augmentation]
max_translation = [32, 16]
max_rotation = 22
max_scale = 0.125
flip = true

[data]
shoeprint_data_dir = "./data/Streaming/Shoeprints/"
shoeprint_dataset_mean = [0.8864, 0.8864, 0.8864] 
shoeprint_dataset_std = [0.2424, 0.2424, 0.2424]

shoemark_data_dir = "./data/Streaming/Shoemarks/"
shoemark_dataset_mean = [0.6919, 0.6443, 0.5891]
shoemark_dataset_std = [0.2416, 0.2508, 0.2796]

floor_image_data_dir = "../one_to_many_gan/flooring/"

wvu_data_dir = "./data/Testing/WVU2019/"
fid_data_dir = "./data/Testing/FID-300/Shoeprints/"

image_size = [512, 256]

