# Deterministic-bridge UNSB row, seed 2, on A40 GPU 0. See
# campaign_unsb_no_noise_local.toml for why n_styles is pinned rather than
# derived; this seed's value comes from
# style_coverage_unsb_no_noise_2_m1024.csv.
#
# ~/UNSB/config_no_noise.toml must exist on this machine (bridge_noise = 0):
#     grep -q '^bridge_noise' config.toml \
#       && sed 's/^bridge_noise = 1.0/bridge_noise = 0.0/' config.toml > config_no_noise.toml \
#       || echo 'no bridge_noise key in config.toml -- sync the repo first'
#
#     uv run python campaign_runner.py campaign_unsb_no_noise_a40_0.toml

[campaign]
gpu = 0
template = "gan_pool_permafrost2_b96_a40.toml"  # data paths under ~/Datasets
unsb_repo = "~/UNSB"
pool_root = "~/Datasets/campaign_pools"
print_dir = "~/Datasets/Siamese/Compiled/Shoeprints/train"
# ~62 GB of pool at this N: check /dev/shm is sized for it before launching
train_root = "/dev/shm/campaign"

[[job]]
name = "unsb_no_noise_2"
backend = "unsb"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_2"
epoch = 52
n_styles = 671
