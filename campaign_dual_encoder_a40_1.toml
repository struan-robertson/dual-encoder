# Dual-encoder chapter campaign (2026-08-20), training-seed-423 stripe, A40
# GPU 1. See campaign_dual_encoder_a40_0.toml for the pinned-generator design
# and the pool transfer; this queue is identical apart from the seed. The two
# GPUs each need the pool in their own tree — after transferring into
# active_gpu0, hardlink it across:
#     cp -al ~/Datasets/campaign_pools/active_gpu0 ~/Datasets/campaign_pools/active_gpu1
# (remove or move the old active_gpu1 tree first).
#
#     uv run python campaign_runner.py campaign_dual_encoder_a40_1.toml

[campaign]
gpu = 1
template = "gan_pool_permafrost2_b96_a40.toml"  # data paths under ~/Datasets
unsb_repo = "~/UNSB"
pool_root = "~/Datasets/campaign_pools"
print_dir = "~/Datasets/Siamese/Compiled/Shoeprints/train"
# ~63 GB of pool at this N: check /dev/shm is sized for it before launching
train_root = "/dev/shm/campaign"

# --- Block 1: pipeline augmentation ablations -------------------------------

[[job]]
name = "pipe_full_3"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"training.seed" = 423

[[job]]
name = "pipe_no_geometric_3"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"training.seed" = 423
"augmentations.shoeprint_affine.enabled" = false
"augmentations.shoemark_affine.enabled" = false
"augmentations.shoemark_back_affine.enabled" = false

[[job]]
name = "pipe_no_photometric_3"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"training.seed" = 423
"augmentations.photometric.enabled" = false
"augmentations.blue_shift.enabled" = false

[[job]]
name = "pipe_no_background_3"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"training.seed" = 423
"augmentations.background_substitution.enabled" = false

[[job]]
name = "pipe_no_partial_3"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"training.seed" = 423
"augmentations.pre_blend_erasing.enabled" = false
"augmentations.post_blend_crop.enabled" = false

[[job]]
name = "pipe_no_dust_invert_3"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"training.seed" = 423
"augmentations.dust_invert.enabled" = false

# --- Block 2: generator-comparison baselines --------------------------------

[[job]]
name = "no_synthetic_3"
backend = "none"
[job.set]
"training.seed" = 423
"data.streaming.synthetic_ratio" = 0.0
"data.streaming.real_pairs_only" = true

[[job]]
name = "no_generator_3"
backend = "none"
[job.set]
"training.seed" = 423

