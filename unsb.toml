[hyperparameters]
p_val = 2
margin = 2
batch_size = 48 # Max that fits the 24 GB card at the full unfreeze ladder (peak 22.3 GiB; 52 hits the ceiling)
embedding_size = 128
triplet_swapping = true

[training]
seed = 4242
epochs = 5_000
gpu_number = 0
print_iter = 100
val_iter = 500
name = "unsb"
resume_checkpoint = "" # Leave empty for no resuming

[training.pre_training]
pre_trained = true
frozen = true
epoch_unfreeze = 500 # Number of epochs between layer unfreezes (see gan_pool.toml)
defrost = 0 # When to start layer unfreezing
# TODO try permafrost 5 when I have all my hyperparameters tuned and I train for longer
permafrost = 4 # Number of layers to unfreeze before leaving frozen, 0 to unfreeze all
refreeze = false # Refreeze previous layer after unfreezing one before

[curriculum]
# In-loop generation is disabled: 5-NFE UNSB generation is ~5x the GAN's cost
# (~105 s/epoch), so marks are pre-generated with UNSB's generate_pool.py
# (checkpoint shoeprint_unsb_v2 epoch 54, pool size from style_coverage.py) and
# streamed from disk via synthetic_shoemark_data_dir below
                # its dynamic-shape compile does not hold: every new batch size would
                # trigger a fresh multi-minute compilation
initial_difficulty = 0.2
max_difficulty = 1.0
peak_steps = 2_500

# Affine transform applied to shoeprints
[augmentations.shoeprint_affine]
enabled = true
flip = true
degrees = 10
translate = [0.05, 0.15]
scale = [0.9, 1.1]
shear = 0.05
fill = 1.0

# Affine transform applied to shoemarks without a pre-existing background
[augmentations.shoemark_affine]
enabled = true
flip = true
degrees = 20
translate = [0.1, 0.3]
scale = [0.75, 1.25]
shear = 0.1
fill = 1.0

# Smaller affine (black fill) applied to shoemarks with a pre-existing background
[augmentations.shoemark_back_affine]
enabled = true
flip = true
degrees = 10
translate = [0.05, 0.15]
scale = [0.9, 1.1]
shear = 0.05
fill = 0.0

# Blend no-background shoemarks onto floor images (dust marks are never blended)
[augmentations.background_substitution]
enabled = true

# Random inversion of dust shoemarks
[augmentations.dust_invert]
enabled = true

# Blue channel shift simulating enhanced blood shoemarks
[augmentations.blue_shift]
enabled = true
p = 0.333
max_shift = 0.25

# Random erasing applied before background blending (mutually exclusive with post_blend_crop)
[augmentations.pre_blend_erasing]
enabled = true
p = 0.5
min_scale = 0.1
max_scale = 0.5
fill = 1.0

# Random crop, scale, and pad applied after background blending
[augmentations.post_blend_crop]
enabled = true
p = 0.5
min_edge = 225
fill = 0.0

# Blur/sharpness and colour jitter applied to shoemarks without a pre-existing background
[augmentations.photometric]
enabled = true
blur_kernel = [5, 9]
blur_sigma = [0.1, 5.0]
sharpness_factor = 2
jitter_p = 0.5
brightness = 0.4
hue = 0.2

[data]
val_dir = "~/Vault/University/Doctorate/Data/Siamese/Evaluation/no_synth/val/"
test_dir = "~/Vault/University/Doctorate/Data/Siamese/Evaluation/no_synth/test/"
wvu_data_dir = "~/Vault/University/Doctorate/Data/Siamese/Evaluation/wvu/cropped/"
fid_data_dir = "~/Development/Doctorate/siamese/data/Testing/FIXME"
image_size = [512, 256]

[data.streaming]
floor_image_data_dir = "~/Vault/University/Doctorate/Data/Flooring/train"
shoeprint_data_dir = "~/Vault/University/Doctorate/Data/Siamese/Compiled/Shoeprints/train"
shoemark_data_dir = "~/Vault/University/Doctorate/Data/Siamese/Compiled/Shoemarks/train"
# pre-generated UNSB marks (generate_pool.py); classes without a real shoemark
# draw a random pool image instead of invoking the generator in-loop
synthetic_shoemark_data_dir = "~/Extra/Doctorate/synthetic/Shoemarks_UNSB/train"
min_floor_roi_height = 512
synthetic_ratio = 0.5
