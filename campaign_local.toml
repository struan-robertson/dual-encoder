# Auto-composed campaign queue (2026-08-04): GAN chapter rows first, then UNSB.
# Seed-striped: this queue holds one seed of every family. no_gan is excluded
# (best FID ~180 — noted in dual_encoder.tex).
#
#     uv run python campaign_runner.py <this file>

[campaign]
gpu = 0
template = "gan_pool_permafrost2_b96.toml"
unsb_repo = "~/Development/Doctorate/diffusion/UNSB"
# pools are transient (one active_gpu<N> tree, overwritten job-to-job), so
# generate straight onto the NVMe and train from it; no ~/Extra copy, no replica
pool_root = "~/Development/Doctorate/synthetic/campaign"

[[job]]
name = "gan_full_1"
backend = "gan"
generator_config = "~/Development/Doctorate/one_to_many_gan/implementation/config.toml"
checkpoint = "~/Development/Doctorate/one_to_many_gan/implementation/checkpoints/new_data_partition_fid_1/models/20000.tar"

[[job]]
name = "gan_no_align_1"
backend = "gan"
generator_config = "~/Development/Doctorate/one_to_many_gan/implementation/config.toml"
checkpoint = "~/Development/Doctorate/one_to_many_gan/implementation/checkpoints/new_data_partition_fid_no_align_1/models/50000.tar"

[[job]]
name = "gan_no_idt_1"
