[project]
name = "siamese"
version = "0.1.0"
description = "Add your description here"
readme = "README.org"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.1",
    "numpy>=2.2.3",
    "pillow>=11.1.0",
    "tqdm>=4.67.1",
    "one-to-many-gan>=0.1.0",
    "scikit-learn>=1.7.2",
    "pyyaml>=6.0.3",
    "impression-tools",
]

# Pick the build of torch that matches the card. CUDA is the default choice:
#     uv sync --extra cuda
#     uv sync --extra rocm
[project.optional-dependencies]
cuda = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
rocm = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "pytorch-triton-rocm>=3.5.1 ; sys_platform == 'linux'",
    "triton-rocm>=3.6.0 ; sys_platform == 'linux'",
]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
one-to-many-gan = { path = "../one_to_many_gan/implementation/", editable = true }
torch = [
  { index = "pytorch-cuda", extra = "cuda" },
  { index = "pytorch-rocm", extra = "rocm" },
]
torchvision = [
  { index = "pytorch-cuda", extra = "cuda" },
  { index = "pytorch-rocm", extra = "rocm" },
]
# ROCm relies on both Triton packages, which come from the same index
pytorch-triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]
impression-tools = { path = "../impression_tools", editable = true }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[dependency-groups]
dev = [
    "line-profiler>=5.0.0",
    "pyright>=1.1.406",
]
    
[tool.ruff]
target-version = "py313"
respect-gitignore = true

[tool.ruff.lint]
extend-select = [ "ALL" ]
extend-ignore = [
    "ANN",  # Type hinting, leave for basedpyright
    "FIX",  # Leave fixme for emacs
    "TD" ,  # Same with todo
    "T201", # print functions are fine
    "F821", # Both Pyright and ruff detect this
    "F722", # Incorrectly throwing errors with forward type annotations
    "F401", # Pyright conflict
    "B006", # Pyright conflict
    "PLR2004", # Using constant values in if statements is a common pattern for me
    "PLR0913", # Functional style programing for Jax requires a lot of arguments
    "INP001", # I dont always want to add an `__init__.py`
    "F841", # Pyright detects this
    "ARG001", # Pyright detects this
    "FBT001", # Bools are useful as arguments
    "E731", # Stay away from my lambda assignments
    "ARG002", # Pyright detects this
    "D107", # __init__ docstring is kinda covered by class docstring
    "D102", # Almost all methods in this project are __call__, which isn't really necessary to document
    "D209", # Docstring closing quotes appear to effect emacs indentation logic
    "D105", # The purpose of magic functions is implicit without a docstring
    "TRY003", # Bit of a crazy rule about raising exceptions
    "S108", # No need to warn about using tmp files
    "N812", # torch.functional as F not f
    "PLR0915", # Training loops can require many statements
    "S311", # I'm not doing any cryptography
    "TC006", # Cast is OK without quotes
    "ERA001", # Commenting out code isn't always bad
    "PT", # I don't use pytest
    "PGH003", # Sometimes there are a lot of errors to ignore
    # Better handled by pyright https://docs.astral.sh/ruff/formatter/#format-suppression
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "ISC002",
    "D213",
    "D203",
    "I001",
    "RUF059"
]
