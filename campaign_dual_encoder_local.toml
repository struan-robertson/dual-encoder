# Dual-encoder chapter campaign (2026-08-20), training-seed-4242 stripe.
#
# Block 1 — pipeline augmentation ablations (promised in the BMVC rebuttal):
# ALL stripes use THE pinned generator, unsb_no_noise_1 @ 56 (N=657) — the
# ablation varies the pipeline, not the generator — and replicate over the
# dual-encoder training seed (4242 here, 422/423 on the A40 stripes). Every
# row shares the unsb_no_noise_1 pool via pool_as: here it is resumed in
# place, on the A40 it is transferred (see campaign_dual_encoder_a40_0.toml).
# This stripe's everything-on baseline is the existing unsb_no_noise_1 row;
# the A40 stripes carry their own pipe_full rows.
#
# Block 2 — generator-comparison baselines with no generator at all,
# replicated over the same training seeds.
#
#     uv run python campaign_runner.py campaign_dual_encoder_local.toml

[campaign]
gpu = 0
template = "gan_pool_permafrost2_b96.toml"
unsb_repo = "~/Development/Doctorate/diffusion/UNSB"
pool_root = "~/Development/Doctorate/synthetic/campaign"

# --- Block 1: pipeline augmentation ablations -------------------------------

[[job]]
name = "pipe_no_geometric_1"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/Development/Doctorate/diffusion/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"augmentations.shoeprint_affine.enabled" = false
"augmentations.shoemark_affine.enabled" = false
"augmentations.shoemark_back_affine.enabled" = false

[[job]]
name = "pipe_no_photometric_1"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/Development/Doctorate/diffusion/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"augmentations.photometric.enabled" = false
"augmentations.blue_shift.enabled" = false

[[job]]
name = "pipe_no_background_1"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/Development/Doctorate/diffusion/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"augmentations.background_substitution.enabled" = false

[[job]]
name = "pipe_no_partial_1"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/Development/Doctorate/diffusion/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"augmentations.pre_blend_erasing.enabled" = false
"augmentations.post_blend_crop.enabled" = false

[[job]]
name = "pipe_no_dust_invert_1"
backend = "unsb"
pool_as = "unsb_no_noise_1"
generator_config = "~/Development/Doctorate/diffusion/UNSB/config_no_noise.toml"
experiment = "shoeprint_unsb_v2_no_noise_1"
epoch = 56
n_styles = 657
[job.set]
"augmentations.dust_invert.enabled" = false

# --- Block 2: generator-comparison baselines --------------------------------

# Real print-mark pairs only: no synthetic marks, and classes without a real
# shoemark are dropped from training (real_pairs_only) rather than given a
# grayscale-shoeprint stand-in
[[job]]
name = "no_synthetic_1"
backend = "none"
[job.set]
"data.streaming.synthetic_ratio" = 0.0
"data.streaming.real_pairs_only" = true

# Full pipeline but no generator: grayscale shoeprints stand in for generated
# marks (the loader's behaviour when no pool is configured)
[[job]]
name = "no_generator_1"
backend = "none"

