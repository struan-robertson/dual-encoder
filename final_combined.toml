[hyperparameters]
distance_norm = 2
margin = 2
batch_size = 96 # Mining pool of the adopted protocol; with the deep ladder this
                # needs gradient_checkpointing on the 24 GB card (peak 11.4 GiB
                # measured with the full ladder open, against 22.3 GiB for
                # deep@48 uncheckpointed)
embedding_size = 128
triplet_swapping = true

[training]
seed = 4242
epochs = 7_500 # Longer cosine horizon: the deep arm was still improving at
               # 5,000, and the anneal must be stretched from the start
               # (T_max = epochs) rather than extended after the fact
gpu_number = 0
print_iter = 100
val_iter = 500
name = "final_combined_1"
resume_checkpoint = "" # Leave empty for no resuming

[training.pre_training]
pre_trained = true
frozen = true
unfreeze_cadence = 500 # Ladder cadence of the ablations: layer4 at 500 ... layer1 at 2,000
ladder_depth = 4 # Deep ladder: fc + layer4..layer1; the stem is never unfrozen
gradient_checkpointing = true # Recompute stage activations in backward so
                              # deep@96 fits locally; BN running stats see
                              # doubled updates (see SharedSiamese.forward)

[curriculum]
# Final-configuration run (dual_encoder.tex, schedule-ablation summary):
# deep ladder + batch 96 + difficulty curriculum + longer cosine horizon,
# combined outside the controlled ablations. Pooled protocol: marks
# pre-generated with generate_pool.py --backend gan from the reconciled-era
# best-FID checkpoint (new_data_partition_fid_1/models/20000.tar, the same
# checkpoint as the campaign's gan_full_1 row) at N=106 per class (that run's
# coverage-derived N), one tree per difficulty in {0.2..0.9, 1.0}
enabled = true
initial_difficulty = 0.2
max_difficulty = 1.0
# Ramp reaches 1.0 at epoch 3000 (0.2 + n/3750): the deep ladder completes at
# 2000, so the whole plastic phase sits inside the ramp and full difficulty
# arrives only once all trainable layers are settled. Stepped once per epoch.
peak_steps = 3_750

# Affine transform applied to shoeprints
[augmentations.shoeprint_affine]
enabled = true
flip = true
degrees = 10
translate = [0.05, 0.15]
scale = [0.9, 1.1]
shear = 0.05
fill = 1.0

# Affine transform applied to shoemarks without a pre-existing background
[augmentations.shoemark_affine]
enabled = true
flip = true
degrees = 20
translate = [0.1, 0.3]
scale = [0.75, 1.25]
shear = 0.1
fill = 1.0

# Smaller affine (black fill) applied to shoemarks with a pre-existing background
[augmentations.shoemark_back_affine]
enabled = true
flip = true
degrees = 10
translate = [0.05, 0.15]
scale = [0.9, 1.1]
shear = 0.05
fill = 0.0

# Blend no-background shoemarks onto floor images (dust marks are never blended)
[augmentations.background_substitution]
enabled = true

# Random inversion of dust shoemarks
[augmentations.dust_invert]
enabled = true

# Blue channel shift simulating enhanced blood shoemarks
[augmentations.blue_shift]
enabled = true
p = 0.333
max_shift = 0.25

# Random erasing applied before background blending (mutually exclusive with post_blend_crop)
[augmentations.pre_blend_erasing]
enabled = true
p = 0.5
min_scale = 0.1
max_scale = 0.5
fill = 1.0

# Random crop, scale, and pad applied after background blending
[augmentations.post_blend_crop]
enabled = true
p = 0.5
min_edge = 225
fill = 0.0

# Blur/sharpness and colour jitter applied to shoemarks without a pre-existing background
[augmentations.photometric]
enabled = true
blur_kernel = [5, 9]
blur_sigma = [0.1, 5.0]
sharpness_factor = 2
jitter_p = 0.5
brightness = 0.4
hue = 0.2

[data]
val_dir = "~/Vault/University/Doctorate/Data/Siamese/Evaluation/no_synth/val/"
test_dir = "~/Vault/University/Doctorate/Data/Siamese/Evaluation/no_synth/test/"
wvu_data_dir = "~/Vault/University/Doctorate/Data/Siamese/Evaluation/wvu/cropped/"
fid_data_dir = "~/Development/Doctorate/siamese/data/Testing/FIXME"
image_size = [512, 256]

[data.streaming]
floor_image_data_dir = "~/Vault/University/Doctorate/Data/Flooring/train"
shoeprint_data_dir = "~/Vault/University/Doctorate/Data/Siamese/Compiled/Shoeprints/train"
shoemark_data_dir = "~/Vault/University/Doctorate/Data/Siamese/Compiled/Shoemarks/train"
# GAN pool trees generated directly on NVMe (no ~/Extra canonical copy: pools
# are transient and ~/Extra lacks the ~120 GB); base train/ plus train_d0.2 ..
# train_d0.9 siblings for the curriculum
synthetic_shoemark_data_dir = "~/Development/Doctorate/synthetic/final/train"
min_floor_roi_height = 512
synthetic_ratio = 0.5
