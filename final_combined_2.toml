# Seed replicate of final_combined.toml, A40 GPU 0. Identical to run 1 apart
# from the seed, the run name, the GPU and the data paths; the seed convention
# is 4242/422/423 across replicates. Run 1 gave WVU S5 0.932 against a previous
# campaign best of 0.874, but on one seed, and the santa_kl seeds spread 0.738
# to 0.843 on the same metric, so the replicates establish whether the gain
# survives the seed.
#
#     uv run --extra cuda python src/training.py final_combined_2.toml

[hyperparameters]
distance_norm = 2
margin = 2
batch_size = 96 # Mining pool of the adopted protocol; with the deep ladder this
                # needs gradient_checkpointing on the 24 GB card (peak 11.4 GiB
                # measured with the full ladder open, against 22.3 GiB for
                # deep@48 uncheckpointed)
embedding_size = 128
triplet_swapping = true

[training]
seed = 422
epochs = 7_500 # Held at run 1's value even though the metrics plateau by 5,000:
               # T_max = epochs, so a shorter run anneals on a different curve
               # and stops being a replicate
gpu_number = 0
print_iter = 100
val_iter = 500
name = "final_combined_2"
resume_checkpoint = "" # Leave empty for no resuming

[training.pre_training]
pre_trained = true
frozen = true
unfreeze_cadence = 500 # Ladder cadence of the ablations: layer4 at 500 ... layer1 at 2,000
ladder_depth = 4 # Deep ladder: fc + layer4..layer1; the stem is never unfrozen
gradient_checkpointing = true # Kept on for the 48 GB card, which does not need
                              # it: the recompute runs each stage's BatchNorms
                              # twice per step, so turning it off would change
                              # the running statistics and break the replicate

[curriculum]
# Final-configuration run (dual_encoder.tex, schedule-ablation summary):
# deep ladder + batch 96 + difficulty curriculum + longer cosine horizon,
# combined outside the controlled ablations. Pooled protocol: marks
# pre-generated with generate_pool.py --backend gan from the reconciled-era
# best-FID checkpoint (new_data_partition_fid_1/models/20000.tar, the same
# checkpoint as the campaign's gan_full_1 row) at N=106 per class (that run's
# coverage-derived N), one tree per difficulty in {0.2..0.9, 1.0}
enabled = true
initial_difficulty = 0.2
max_difficulty = 1.0
# Ramp reaches 1.0 at epoch 3000 (0.2 + n/3750): the deep ladder completes at
# 2000, so the whole plastic phase sits inside the ramp and full difficulty
# arrives only once all trainable layers are settled. Stepped once per epoch.
peak_steps = 3_750

# Affine transform applied to shoeprints
[augmentations.shoeprint_affine]
enabled = true
flip = true
degrees = 10
translate = [0.05, 0.15]
scale = [0.9, 1.1]
shear = 0.05
fill = 1.0

# Affine transform applied to shoemarks without a pre-existing background
[augmentations.shoemark_affine]
enabled = true
flip = true
degrees = 20
translate = [0.1, 0.3]
scale = [0.75, 1.25]
shear = 0.1
fill = 1.0

# Smaller affine (black fill) applied to shoemarks with a pre-existing background
[augmentations.shoemark_back_affine]
enabled = true
flip = true
degrees = 10
translate = [0.05, 0.15]
scale = [0.9, 1.1]
shear = 0.05
fill = 0.0

# Blend no-background shoemarks onto floor images (dust marks are never blended)
[augmentations.background_substitution]
enabled = true

# Random inversion of dust shoemarks
[augmentations.dust_invert]
enabled = true

# Blue channel shift simulating enhanced blood shoemarks
[augmentations.blue_shift]
enabled = true
p = 0.333
max_shift = 0.25

# Random erasing applied before background blending (mutually exclusive with post_blend_crop)
[augmentations.pre_blend_erasing]
enabled = true
p = 0.5
min_scale = 0.1
max_scale = 0.5
fill = 1.0

# Random crop, scale, and pad applied after background blending
[augmentations.post_blend_crop]
enabled = true
p = 0.5
min_edge = 225
fill = 0.0

# Blur/sharpness and colour jitter applied to shoemarks without a pre-existing background
[augmentations.photometric]
enabled = true
blur_kernel = [5, 9]
blur_sigma = [0.1, 5.0]
sharpness_factor = 2
jitter_p = 0.5
brightness = 0.4
hue = 0.2

[data]
val_dir = "~/Datasets/Siamese/Evaluation/no_synth/val/"
test_dir = "~/Datasets/Siamese/Evaluation/no_synth/test/"
wvu_data_dir = "~/Datasets/Siamese/Evaluation/wvu/cropped/"
image_size = [512, 256]

[data.streaming]
floor_image_data_dir = "~/Datasets/Flooring/train"
shoeprint_data_dir = "~/Datasets/Siamese/Compiled/Shoeprints/train"
shoemark_data_dir = "~/Datasets/Siamese/Compiled/Shoemarks/train"
# Transferred from the local machine, not generated here. Base train/ plus the
# train_d0.2 .. train_d0.9 siblings, ~120 GB in total, so this cannot sit in
# /dev/shm the way the smaller campaign pools did. The two GPUs can share one
# copy: the pool is read-only during training.
synthetic_shoemark_data_dir = "~/Datasets/pools/final/train"
min_floor_roi_height = 512
synthetic_ratio = 0.5
